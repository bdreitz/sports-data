name: Update stats

on:
  # GitHub can delay or drop scheduled runs, especially at the top of the hour, so this runs
  # at odd minutes, with two backups. Extra runs are harmless: each run replaces rows rather
  # than adding them, runs never overlap (see concurrency), and later runs refresh the
  # report's injury check.
  schedule:
    - cron: "23 10 * * *"       # 10:23 UTC (5:23-6:23am Eastern), after late games are final
    - cron: "47 11 * * *"       # backup
    - cron: "17 13 * * *"       # backup (8:17-9:17am Eastern)
    - cron: "47 21 * * *"       # late afternoon (4:47-5:47pm Eastern): fresher injury news for the
                                # report and the daily record, closer to tip-off
  workflow_dispatch:            # adds a "Run workflow" button on the Actions tab
    inputs:
      full_rebuild:
        description: "Re-fetch every game this season"
        type: boolean
        default: false

permissions:
  contents: write               # needed to create and update the "data" release

concurrency:
  group: update-stats           # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest      # the standard runner: free on public repositories
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and check the data
        run: python update.py --out out
        env:
          FULL_REBUILD: ${{ inputs.full_rebuild && '1' || '0' }}

      # Today's props for every sport, from the files just built (a sport that failed its checks
      # uses its previously published files). Written to a temporary file first, so a failure
      # never replaces yesterday's report with an empty one.
      - name: Build today's props report
        if: always()
        continue-on-error: true
        env:
          SPORTS_DATA_LOCAL: out
          SPORTS_DATA_REPO: ${{ github.repository }}
        run: |
          python -c "import sports_data; sports_data.daily(page=False)" > daily_props.txt
          cat daily_props.txt
          mv daily_props.txt out/daily_props.txt

      # Saves what the report flags and the injury report for today's teams, adding to monthly
      # CSV files on the "history" release (flagged_props_YYYY-MM.csv, injuries_YYYY-MM.csv),
      # for backtesting. Each run adds a timestamped snapshot.
      - name: Save today's flagged props and injury reports
        if: always()
        continue-on-error: true
        env:
          SPORTS_DATA_LOCAL: out
          SPORTS_DATA_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p history_in history_out
          gh release download history --dir history_in --pattern "*.csv" || echo "No history yet."
          python -c "import sports_data; sports_data.save_daily_record('history_out', 'history_in')"
          gh release view history >/dev/null 2>&1 || \
            gh release create history --title "Daily history" --notes "Flagged props and injury reports, saved by each Update stats run."
          shopt -s nullglob
          files=(history_out/*)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload history "${files[@]}" --clobber
          fi

      # Runs even if a sport failed its checks: that sport only has its status file in out/,
      # so its previously published data stays untouched, while a sport that passed is updated.
      - name: Publish to the "data" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "Stats data" --notes "Updated daily by the Update stats workflow."
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload data "${files[@]}" --clobber
          fi
